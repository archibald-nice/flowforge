name: Bug report
description: Report something that behaves differently from the documented behaviour.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the details
        below — concrete reproduction steps are the fastest path to a fix.
        For security vulnerabilities, use the process in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the canvas at 127.0.0.1:5173
        2. Create a text node and an image node
        3. Connect them and ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which generation mode was active?
      options:
        - Mock (default, no keys configured)
        - Real provider (keys configured in .env.local)
        - Both / not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 141 / macOS 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FlowForge version or commit
      placeholder: e.g. v1.0.0 or a commit sha
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Anything from the browser devtools that looks relevant.
    validations:
      required: false
